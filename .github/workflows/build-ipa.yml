name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ios]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.0-16.2 (React Native 0.72 breaks on newer clang)
        run: |
          for v in 16.2 16.1 16.0 16; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"; break
            fi
          done
          xcodebuild -version

      - name: Ensure iOS platform is installed for this Xcode
        run: |
          xcodebuild -showsdks
          xcrun simctl list runtimes | grep -q "iOS $(xcrun --sdk iphoneos --show-sdk-version)" \
            || xcodebuild -downloadPlatform iOS

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS deps
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build JS bundle
        run: mkdir -p ios/bundle && npm run bundle:ios

      - name: Pod install
        working-directory: ios
        run: pod install

      - name: Build app (no code signing)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/XStreaming.xcworkspace \
            -scheme XStreaming \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || {
              echo "===== ERRORS (with context) ====="
              grep -n -B6 -A4 -E "(error|fatal error):" xcodebuild.log | grep -vE "Disabling previews|deployment target" | head -200
              echo "===== FAILED COMMANDS ====="
              sed -n '/The following build commands failed/,$p' xcodebuild.log
              exit 1; }
          tail -5 xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/XStreaming.app/XStreaming

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/XStreaming.app Payload/
          zip -qry XStreaming-unsigned.ipa Payload
          shasum -a 256 XStreaming-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: XStreaming-unsigned-ipa
          path: XStreaming-unsigned.ipa
